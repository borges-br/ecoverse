name: Build and publish EcoVerse

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ecoverse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node tools/deploy/check-stack.mjs

  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, api]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - name: Generate Prisma client
        if: matrix.app == 'api'
        run: npm run prisma:generate
      - run: npm run lint
      - run: npm run type-check
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Domain tests
        if: matrix.app == 'api'
        run: node --test tests/*.test.cjs

  publish:
    needs: [quality, stack]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish EcoVerse image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.app }}
          file: ./${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ecoverse-${{ matrix.app }}:latest
            ghcr.io/${{ github.repository_owner }}/ecoverse-${{ matrix.app }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=EcoVerse ${{ matrix.app }}
          cache-from: type=gha,scope=ecoverse-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=ecoverse-${{ matrix.app }}
