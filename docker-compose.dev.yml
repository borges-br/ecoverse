services:
  ecoverse-web:
    build:
      target: builder
    command: npm run dev
    environment:
      NODE_ENV: development
    volumes:
      - ./web:/app
      - ecoverse_web_node_modules:/app/node_modules

  ecoverse-api:
    user: node
    build:
      target: builder
    command: sh -c "node node_modules/prisma/build/index.js migrate deploy && npm run dev"
    environment:
      NODE_ENV: development
    volumes:
      - ./api:/app
      - ecoverse_api_node_modules:/app/node_modules

volumes:
  ecoverse_web_node_modules:
  ecoverse_api_node_modules:
