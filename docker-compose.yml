# EcoVerse: own database, Redis and uploads; preserve all VestGO volumes.
name: ecoverse-local
services:
  ecoverse-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-${API_PUBLIC_URL:-http://localhost:3001}}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://ecoverse-api:3001}
      NEXT_PUBLIC_MAPBOX_TOKEN: ${MAPBOX_PUBLIC_TOKEN:-}
      MAPBOX_PUBLIC_TOKEN: ${MAPBOX_PUBLIC_TOKEN:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-${APP_PUBLIC_URL:-http://localhost:3000}}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-ecoverse-local-secret-change-me}
      AUTH_SECRET: ${AUTH_SECRET:-ecoverse-local-secret-change-me}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
    ports:
      - '3000:3000'
    depends_on:
      ecoverse-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - '-qO-'
        - http://127.0.0.1:3000/
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ecoverse_internal
  ecoverse-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: sh -c "node node_modules/prisma/build/index.js migrate deploy && npm run start"
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3001}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-ecoverse}:${POSTGRES_PASSWORD:-ecoverse}@ecoverse-db:5432/${POSTGRES_DB:-ecoverse}}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-ecoverse_redis_password}@ecoverse-redis:6379}
      JWT_SECRET: ${JWT_SECRET:-ecoverse-jwt-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-ecoverse-refresh-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-${APP_PUBLIC_URL:-http://localhost:3000}}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-EcoVerse}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      EMAIL_VERIFICATION_EXPIRES_MINUTES: ${EMAIL_VERIFICATION_EXPIRES_MINUTES:-1440}
      ACCOUNT_DELETION_EXPIRES_MINUTES: ${ACCOUNT_DELETION_EXPIRES_MINUTES:-60}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      GEOCODING_BASE_URL: ${GEOCODING_BASE_URL:-https://nominatim.openstreetmap.org/search}
      GEOCODING_USER_AGENT: ${GEOCODING_USER_AGENT:-EcoVerse/1.0 (contato@mosfet.com.br)}
      GEOCODING_ACCEPT_LANGUAGE: ${GEOCODING_ACCEPT_LANGUAGE:-pt-BR}
      GEOCODING_COUNTRY_CODES: ${GEOCODING_COUNTRY_CODES:-br}
      GEOCODING_TIMEOUT_MS: ${GEOCODING_TIMEOUT_MS:-5000}
      GEOCODING_EMAIL: ${GEOCODING_EMAIL:-}
      GEOCODING_PROVIDER: ${GEOCODING_PROVIDER:-nominatim}
      MAPBOX_SECRET_TOKEN: ${MAPBOX_SECRET_TOKEN:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      UPLOADS_DIR: /app/uploads
    ports:
      - '3001:3001'
    depends_on:
      ecoverse-db:
        condition: service_healthy
      ecoverse-redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - '-qO-'
        - http://127.0.0.1:3001/health/ready
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ecoverse_internal
    volumes:
      - ecoverse_uploads_data:/app/uploads
  ecoverse-db:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecoverse}
      POSTGRES_USER: ${POSTGRES_USER:-ecoverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecoverse}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ecoverse_db_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - '5433:5432'
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-ecoverse} -d ${POSTGRES_DB:-ecoverse}
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ecoverse_internal
  ecoverse-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: |
      redis-server --requirepass ${REDIS_PASSWORD:-ecoverse_redis_password} --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1000
    volumes:
      - ecoverse_redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - '-a'
        - ${REDIS_PASSWORD:-ecoverse_redis_password}
        - ping
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecoverse_internal
volumes:
  ecoverse_db_data: null
  ecoverse_redis_data: null
  ecoverse_uploads_data: null
networks:
  ecoverse_internal:
    driver: bridge
