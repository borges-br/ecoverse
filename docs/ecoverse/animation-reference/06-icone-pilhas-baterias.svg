<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&amp;family=Manrope:wght@700&amp;display=swap');
      .mat-stroke-1 {
        stroke: #153F35;
        stroke-width: 2.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 160;
        stroke-dashoffset: 160;
        animation: matDraw1 4.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .mat-accent-1 {
        fill: #CBEA73;
        transform-origin: 182px 34px;
        opacity: 0;
        animation: matDot1 4.6s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }
      @keyframes matDraw1 {
        0% { stroke-dashoffset: 160; }
        17.4%, 90% { stroke-dashoffset: 0; }
        98%, 100% { stroke-dashoffset: 160; }
      }
      @keyframes matDot1 {
        0%, 16.5% { opacity: 0; transform: scale(0.2); }
        22.8%, 90% { opacity: 1; transform: scale(1); }
        98%, 100% { opacity: 0; transform: scale(0.2); }
      }
      @media (prefers-reduced-motion: reduce) {
        .mat-stroke-1 { animation: none; stroke-dashoffset: 0; }
        .mat-accent-1 { animation: none; opacity: 1; transform: none; }
      }
    </style>
  </defs>

  <!-- Card Branco Oficial da Página 14 -->
  <rect x="6" y="6" width="208" height="248" rx="18" fill="#FFFFFF" stroke="#DCE8DE" stroke-width="1.5" />

  <!-- Plano Secundário Névoa #DCE8DE -->
  <rect x="20" y="20" width="180" height="108" rx="12" fill="#DCE8DE" />
  <circle class="mat-accent-1" cx="182" cy="34" r="6" />

  <!-- Ícone Oficial de Pilhas e Baterias (Coordenadas Exatas da Pág. 14) -->
  <g transform="translate(74, 38) scale(1.5)">
    <rect class="mat-stroke-1" x="11" y="7" width="26" height="36" rx="4" />
    <path class="mat-stroke-1" d="M 20 3 L 28 3" />
    <path class="mat-stroke-1" d="M 24 15 L 24 25 M 19 20 L 29 20" />
    <path class="mat-stroke-1" d="M 19 33 L 29 33" />
  </g>

  <!-- Rótulo Explícito e Orientação -->
  <text x="22" y="162" font-family="'Manrope', sans-serif" font-size="17" font-weight="700" fill="#153F35">Pilhas e baterias</text>
  <text x="22" y="192" font-family="'DM Sans', sans-serif" font-size="13" fill="#23352D">Tipos e restrições definidos</text>
  <text x="22" y="210" font-family="'DM Sans', sans-serif" font-size="13" fill="#23352D">por parceiro.</text>
</svg>
