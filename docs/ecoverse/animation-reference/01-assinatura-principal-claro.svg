<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@700&amp;display=swap');
      .ev-e-trace-1 {
        stroke: #153F35;
        stroke-width: 11;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 260;
        stroke-dashoffset: 260;
        animation: evTraceIn1 4.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .ev-e-dot-1 {
        fill: #28735A;
        transform-origin: 82px 70px;
        opacity: 0;
        animation: evDotIn1 4.6s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }
      .ev-wordmark-1 {
        font-family: 'Manrope', system-ui, -apple-system, sans-serif;
        font-weight: 700;
        font-size: 62px;
        fill: #153F35;
        letter-spacing: -0.02em;
      }
      /* 4.6s cycle: 0-17.4% (800ms) trace | 17.4%-22.8% (250ms) dot | 22.8%-92% rest | 92-100% reset */
      @keyframes evTraceIn1 {
        0% { stroke-dashoffset: 260; }
        17.4%, 90% { stroke-dashoffset: 0; }
        98%, 100% { stroke-dashoffset: 260; }
      }
      @keyframes evDotIn1 {
        0%, 16.5% { opacity: 0; transform: scale(0.2); }
        22.8%, 90% { opacity: 1; transform: scale(1); }
        98%, 100% { opacity: 0; transform: scale(0.2); }
      }
      @media (prefers-reduced-motion: reduce) {
        .ev-e-trace-1 { animation: none; stroke-dashoffset: 0; }
        .ev-e-dot-1 { animation: none; opacity: 1; transform: none; }
      }
    </style>
  </defs>

  <!-- Símbolo Oficial na Malha 100x100 deslocado para (14, 10) -->
  <g transform="translate(14, 10)">
    <path class="ev-e-trace-1" d="M 20 50 L 82 50 C 82 32.327 67.673 18 50 18 C 32.327 18 18 32.327 18 50 C 18 67.673 32.327 82 50 82 C 56.3 82 62.2 80.2 67.2 77" />
    <circle class="ev-e-dot-1" cx="82" cy="70" r="6.5" />
  </g>

  <!-- Assinatura Oficial Manrope 700 Inteira em #153F35 -->
  <text class="ev-wordmark-1" x="132" y="81">EcoVerse</text>
</svg>
