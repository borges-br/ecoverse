<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="pedestalBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#153F35" />
      <stop offset="55%" stop-color="#1E5547" />
      <stop offset="100%" stop-color="#0E2C25" />
    </linearGradient>
    <linearGradient id="oilAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6C453" />
      <stop offset="50%" stop-color="#D98A2B" />
      <stop offset="100%" stop-color="#B66616" />
    </linearGradient>
    <linearGradient id="copperTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D98A4E" />
      <stop offset="100%" stop-color="#B86B35" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&amp;family=Manrope:wght@700&amp;display=swap');
      .tactile-path-draw {
        stroke-dasharray: 760;
        stroke-dashoffset: 760;
        animation: tactilePathIn 5.2s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .tactile-sphere {
        transform-origin: 72px 322px;
        opacity: 0;
        animation: tactileNodeIn 5.2s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }
      .station-1 {
        transform-origin: 185px 275px;
        animation: stationReveal1 5.2s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .station-2 {
        transform-origin: 310px 235px;
        animation: stationReveal2 5.2s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .station-3 {
        transform-origin: 440px 195px;
        animation: stationReveal3 5.2s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .station-4 {
        transform-origin: 565px 155px;
        animation: stationReveal4 5.2s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      @keyframes tactilePathIn {
        0% { stroke-dashoffset: 760; }
        18%, 90% { stroke-dashoffset: 0; }
        98%, 100% { stroke-dashoffset: 760; }
      }
      @keyframes tactileNodeIn {
        0%, 15% { opacity: 0; transform: scale(0.3); }
        22%, 90% { opacity: 1; transform: scale(1); }
        98%, 100% { opacity: 0; transform: scale(0.3); }
      }
      @keyframes stationReveal1 {
        0%, 4% { opacity: 0; transform: translateY(10px); }
        12%, 90% { opacity: 1; transform: translateY(0); }
        98%, 100% { opacity: 0; transform: translateY(10px); }
      }
      @keyframes stationReveal2 {
        0%, 8% { opacity: 0; transform: translateY(10px); }
        16%, 90% { opacity: 1; transform: translateY(0); }
        98%, 100% { opacity: 0; transform: translateY(10px); }
      }
      @keyframes stationReveal3 {
        0%, 12% { opacity: 0; transform: translateY(10px); }
        20%, 90% { opacity: 1; transform: translateY(0); }
        98%, 100% { opacity: 0; transform: translateY(10px); }
      }
      @keyframes stationReveal4 {
        0%, 16% { opacity: 0; transform: translateY(10px); }
        24%, 90% { opacity: 1; transform: translateY(0); }
        98%, 100% { opacity: 0; transform: translateY(10px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .tactile-path-draw { animation: none; stroke-dashoffset: 0; }
        .tactile-sphere, .station-1, .station-2, .station-3, .station-4 {
          animation: none; opacity: 1; transform: none;
        }
      }
    </style>
  </defs>

  <!-- Fundo Editorial Papel Suave (#F4F3EA) -->
  <rect x="8" y="8" width="664" height="374" rx="24" fill="#F4F3EA" stroke="#DCE8DE" stroke-width="2" />

  <!-- Cabeçalho Editorial Interno -->
  <rect x="28" y="26" width="196" height="28" rx="14" fill="#DCE8DE" />
  <text x="42" y="44" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#153F35" letter-spacing="0.06em">CADA MATERIAL, UM DESTINO</text>

  <!-- Sombra Suave do Percurso no Piso -->
  <path d="M 72 328 C 130 315, 145 292, 185 285 C 235 276, 260 252, 310 245 C 360 238, 390 212, 440 205 C 490 198, 520 172, 565 165" stroke="#DCE8DE" stroke-width="26" stroke-linecap="round" />

  <!-- Trilha Gráfica Tátil Conectando os Grupos Separados -->
  <path class="tactile-path-draw" d="M 72 322 C 130 309, 145 286, 185 279 C 235 270, 260 246, 310 239 C 360 232, 390 206, 440 199 C 490 192, 520 166, 565 159" stroke="#28735A" stroke-width="18" stroke-linecap="round" />

  <!-- ESTAÇÃO 4 (Topo Direito): Óleo de Cozinha -->
  <g class="station-4">
    <!-- Pedestal Cilíndrico Floresta + Topo Lima -->
    <path d="M 517 152 V 182 C 517 192 613 192 613 182 V 152 Z" fill="url(#pedestalBody)" />
    <ellipse cx="565" cy="152" rx="48" ry="13" fill="#153F35" />
    <ellipse cx="565" cy="150" rx="36" ry="9" fill="#CBEA73" />
    <!-- Garrafa de Óleo de Cozinha Tátil -->
    <rect x="556" y="44" width="18" height="9" rx="3" fill="#28735A" />
    <path d="M 555 53 L 555 62 C 542 68 542 75 542 86 L 542 138 C 542 146 588 146 588 138 L 588 86 C 588 75 588 68 575 62 L 575 53 Z" fill="url(#oilAmber)" stroke="#153F35" stroke-width="2" />
    <!-- Rótulo e sulcos da garrafa -->
    <line x1="545" y1="98" x2="585" y2="98" stroke="#F4F3EA" stroke-opacity="0.65" stroke-width="2" />
    <line x1="545" y1="118" x2="585" y2="118" stroke="#F4F3EA" stroke-opacity="0.65" stroke-width="2" />
    <text x="565" y="214" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#153F35">Óleo de cozinha</text>
  </g>

  <!-- ESTAÇÃO 3 (Meio Direito): Lâmpadas -->
  <g class="station-3">
    <!-- Pedestal Cilíndrico -->
    <path d="M 392 192 V 222 C 392 232 488 232 488 222 V 192 Z" fill="url(#pedestalBody)" />
    <ellipse cx="440" cy="192" rx="48" ry="13" fill="#153F35" />
    <ellipse cx="440" cy="190" rx="36" ry="9" fill="#CBEA73" />
    <!-- Redoma/Lâmpada Fluorescente Compacta Espiral Tátil -->
    <rect x="418" y="96" width="44" height="86" rx="22" fill="#FFFFFF" fill-opacity="0.65" stroke="#DCE8DE" stroke-width="2" />
    <rect x="428" y="168" width="24" height="16" rx="3" fill="#D6D9D8" stroke="#153F35" stroke-width="2" />
    <path d="M 430 162 C 424 156 456 152 450 144 C 424 138 456 134 450 126 C 424 120 454 114 440 108" stroke="#153F35" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <text x="440" y="254" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#153F35">Lâmpadas</text>
  </g>

  <!-- ESTAÇÃO 2 (Meio Esquerdo): Eletrônicos -->
  <g class="station-2">
    <!-- Pedestal Cilíndrico -->
    <path d="M 262 232 V 262 C 262 272 358 272 358 262 V 232 Z" fill="url(#pedestalBody)" />
    <ellipse cx="310" cy="232" rx="48" ry="13" fill="#153F35" />
    <ellipse cx="310" cy="230" rx="36" ry="9" fill="#DDEAF5" stroke="#28735A" stroke-width="1.5" />
    <!-- Dispositivo Portátil / Smartphone em Pé -->
    <rect x="292" y="148" width="36" height="74" rx="6" fill="#23352D" stroke="#153F35" stroke-width="2.5" />
    <rect x="296" y="155" width="28" height="48" rx="3" fill="#153F35" />
    <circle cx="310" cy="212" r="4" fill="#DCE8DE" />
    <text x="310" y="294" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#153F35">Eletrônicos</text>
  </g>

  <!-- ESTAÇÃO 1 (Base Esquerda): Pilhas e Baterias -->
  <g class="station-1">
    <!-- Pedestal Cilíndrico -->
    <path d="M 137 272 V 302 C 137 312 233 312 233 302 V 272 Z" fill="url(#pedestalBody)" />
    <ellipse cx="185" cy="272" rx="48" ry="13" fill="#153F35" />
    <ellipse cx="185" cy="270" rx="36" ry="9" fill="#CBEA73" />
    <!-- Par de Pilhas Cilíndricas (Estilo Tátil da Pág. 15) -->
    <!-- Pilha 1 -->
    <rect x="169" y="220" width="13" height="4" rx="1.5" fill="#D6D9D8" />
    <rect x="166" y="224" width="19" height="14" rx="2" fill="url(#copperTop)" stroke="#153F35" stroke-width="1.8" />
    <rect x="166" y="238" width="19" height="28" rx="2" fill="#153F35" />
    <!-- Pilha 2 -->
    <rect x="193" y="226" width="13" height="4" rx="1.5" fill="#D6D9D8" />
    <rect x="190" y="230" width="19" height="12" rx="2" fill="url(#copperTop)" stroke="#153F35" stroke-width="1.8" />
    <rect x="190" y="242" width="19" height="24" rx="2" fill="#153F35" />
    <text x="185" y="334" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#153F35">Pilhas e baterias</text>
  </g>

  <!-- Esfera Lima Destino (#CBEA73) na Ponta do Percurso -->
  <g class="tactile-sphere">
    <circle cx="72" cy="322" r="22" fill="#CBEA73" stroke="#153F35" stroke-width="2.5" />
    <circle cx="65" cy="315" r="6" fill="#F4F3EA" opacity="0.6" />
  </g>

  <!-- Nota Editorial de Rodapé -->
  <text x="28" y="364" font-family="'DM Sans', sans-serif" font-size="11.5" font-weight="500" fill="#23352D">
    O percurso gráfico conecta grupos de materiais que permanecem separados na coleta e na triagem.
  </text>
</svg>
