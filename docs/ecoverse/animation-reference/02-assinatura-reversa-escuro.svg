<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@700&amp;display=swap');
      .ev-e-trace-rev {
        stroke: #F4F3EA;
        stroke-width: 11;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 260;
        stroke-dashoffset: 260;
        animation: evTraceInRev 4.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .ev-e-dot-rev {
        fill: #CBEA73;
        transform-origin: 82px 70px;
        opacity: 0;
        animation: evDotInRev 4.6s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }
      .ev-wordmark-rev {
        font-family: 'Manrope', system-ui, -apple-system, sans-serif;
        font-weight: 700;
        font-size: 62px;
        fill: #F4F3EA;
        letter-spacing: -0.02em;
      }
      @keyframes evTraceInRev {
        0% { stroke-dashoffset: 260; }
        17.4%, 90% { stroke-dashoffset: 0; }
        98%, 100% { stroke-dashoffset: 260; }
      }
      @keyframes evDotInRev {
        0%, 16.5% { opacity: 0; transform: scale(0.2); }
        22.8%, 90% { opacity: 1; transform: scale(1); }
        98%, 100% { opacity: 0; transform: scale(0.2); }
      }
      @media (prefers-reduced-motion: reduce) {
        .ev-e-trace-rev { animation: none; stroke-dashoffset: 0; }
        .ev-e-dot-rev { animation: none; opacity: 1; transform: none; }
      }
    </style>
  </defs>

  <!-- Container Floresta #153F35 -->
  <rect x="4" y="4" width="452" height="112" rx="20" fill="#153F35" />

  <!-- Símbolo Oficial na Malha 100x100 -->
  <g transform="translate(18, 10)">
    <path class="ev-e-trace-rev" d="M 20 50 L 82 50 C 82 32.327 67.673 18 50 18 C 32.327 18 18 32.327 18 50 C 18 67.673 32.327 82 50 82 C 56.3 82 62.2 80.2 67.2 77" />
    <circle class="ev-e-dot-rev" cx="82" cy="70" r="6.5" />
  </g>

  <!-- Assinatura Oficial Manrope 700 em Papel #F4F3EA -->
  <text class="ev-wordmark-rev" x="136" y="81">EcoVerse</text>
</svg>
