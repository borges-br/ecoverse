<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;family=Manrope:wght@700&amp;display=swap');
      .trace-seg-1 {
        stroke: #28735A;
        stroke-width: 2.5;
        stroke-dasharray: 44;
        stroke-dashoffset: 44;
        animation: segDraw1 5.2s ease-out infinite;
      }
      .trace-seg-2 {
        stroke: #28735A;
        stroke-width: 2.5;
        stroke-dasharray: 44;
        stroke-dashoffset: 44;
        animation: segDraw2 5.2s ease-out infinite;
      }
      .trace-seg-3 {
        stroke: #28735A;
        stroke-width: 2.5;
        stroke-dasharray: 44;
        stroke-dashoffset: 44;
        animation: segDraw3 5.2s ease-out infinite;
      }
      .node-check-4 {
        transform-origin: 48px 218px;
        opacity: 0;
        animation: checkIn4 5.2s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }
      @keyframes segDraw1 {
        0%, 3% { stroke-dashoffset: 44; }
        10%, 90% { stroke-dashoffset: 0; }
        98%, 100% { stroke-dashoffset: 44; }
      }
      @keyframes segDraw2 {
        0%, 10% { stroke-dashoffset: 44; }
        17%, 90% { stroke-dashoffset: 0; }
        98%, 100% { stroke-dashoffset: 44; }
      }
      @keyframes segDraw3 {
        0%, 17% { stroke-dashoffset: 44; }
        24%, 90% { stroke-dashoffset: 0; }
        98%, 100% { stroke-dashoffset: 44; }
      }
      @keyframes checkIn4 {
        0%, 22% { opacity: 0; transform: scale(0.3); }
        28%, 90% { opacity: 1; transform: scale(1); }
        98%, 100% { opacity: 0; transform: scale(0.3); }
      }
      @media (prefers-reduced-motion: reduce) {
        .trace-seg-1, .trace-seg-2, .trace-seg-3 { animation: none; stroke-dashoffset: 0; }
        .node-check-4 { animation: none; opacity: 1; transform: none; }
      }
    </style>
  </defs>

  <!-- Card Papel #F4F3EA -->
  <rect x="6" y="6" width="668" height="348" rx="20" fill="#F4F3EA" stroke="#DCE8DE" stroke-width="1.5" />

  <!-- Linhas Verticais de Base (#C8D3C9) -->
  <line x1="48" y1="54" x2="48" y2="90" stroke="#C8D3C9" stroke-width="2" />
  <line x1="48" y1="112" x2="48" y2="148" stroke="#C8D3C9" stroke-width="2" />
  <line x1="48" y1="170" x2="48" y2="206" stroke="#C8D3C9" stroke-width="2" />
  <line x1="48" y1="228" x2="48" y2="264" stroke="#C8D3C9" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Linhas Verticais Animadas até o Estado 4 (Operação Atual) -->
  <line class="trace-seg-1" x1="48" y1="54" x2="48" y2="90" />
  <line class="trace-seg-2" x1="48" y1="112" x2="48" y2="148" />
  <line class="trace-seg-3" x1="48" y1="170" x2="48" y2="206" />

  <!-- ESTADO 1: Cadastro de descarte -->
  <circle cx="48" cy="42" r="10" fill="#28735A" />
  <text x="76" y="47" font-family="'Manrope', sans-serif" font-size="16" font-weight="700" fill="#153F35">Cadastro de descarte</text>
  <text x="330" y="47" font-family="'DM Sans', sans-serif" font-size="13.5" fill="#23352D">Intenção registrada, antes da entrega.</text>

  <!-- ESTADO 2: Recebido no ponto -->
  <circle cx="48" cy="101" r="10" fill="#28735A" />
  <text x="76" y="106" font-family="'Manrope', sans-serif" font-size="16" font-weight="700" fill="#153F35">Recebido no ponto</text>
  <text x="330" y="106" font-family="'DM Sans', sans-serif" font-size="13.5" fill="#23352D">Recebimento confirmado no local (QR).</text>

  <!-- ESTADO 3: Em transporte -->
  <circle cx="48" cy="159" r="10" fill="#28735A" />
  <text x="76" y="164" font-family="'Manrope', sans-serif" font-size="16" font-weight="700" fill="#153F35">Em transporte</text>
  <text x="330" y="164" font-family="'DM Sans', sans-serif" font-size="13.5" fill="#23352D">Movimentação registrada pelo operador.</text>

  <!-- ESTADO 4: Recebido pelo parceiro (Limite atual do backend) -->
  <circle cx="48" cy="218" r="10" fill="#28735A" />
  <circle class="node-check-4" cx="48" cy="218" r="4.5" fill="#CBEA73" />
  <text x="76" y="223" font-family="'Manrope', sans-serif" font-size="16" font-weight="700" fill="#153F35">Recebido pelo parceiro</text>
  <text x="330" y="223" font-family="'DM Sans', sans-serif" font-size="13.5" fill="#23352D">Chegada ao parceiro e fechamento de lote.</text>

  <!-- ESTADO 5: Destinação comprovada (Etapa futura / não implementada - Pág. 20) -->
  <circle cx="48" cy="276" r="10" fill="#325F84" />
  <text x="76" y="281" font-family="'Manrope', sans-serif" font-size="16" font-weight="700" fill="#153F35">Destinação comprovada</text>
  <text x="330" y="281" font-family="'DM Sans', sans-serif" font-size="13.5" fill="#23352D">Somente com evidência específica e verificável.</text>

  <!-- Badge Oficial ETAPA FUTURA / NÃO IMPLEMENTADA (Pág. 20) -->
  <rect x="76" y="302" width="234" height="28" rx="14" fill="#DDEAF5" />
  <text x="193" y="320" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#325F84" letter-spacing="0.04em">ETAPA FUTURA / NÃO IMPLEMENTADA</text>
  <text x="330" y="315" font-family="'DM Sans', sans-serif" font-size="11.5" fill="#5D6C63">O fechamento de lote é operacional; não autoriza,</text>
  <text x="330" y="330" font-family="'DM Sans', sans-serif" font-size="11.5" fill="#5D6C63">por si só, afirmar destinação final comprovada.</text>
</svg>
