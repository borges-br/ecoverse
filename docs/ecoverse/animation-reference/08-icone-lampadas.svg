<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&amp;family=Manrope:wght@700&amp;display=swap');
      .mat-stroke-3 {
        stroke: #153F35;
        stroke-width: 2.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 160;
        stroke-dashoffset: 160;
        animation: matDraw3 4.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .mat-accent-3 {
        fill: #CBEA73;
        transform-origin: 182px 34px;
        opacity: 0;
        animation: matDot3 4.6s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }
      @keyframes matDraw3 {
        0% { stroke-dashoffset: 160; }
        17.4%, 90% { stroke-dashoffset: 0; }
        98%, 100% { stroke-dashoffset: 160; }
      }
      @keyframes matDot3 {
        0%, 16.5% { opacity: 0; transform: scale(0.2); }
        22.8%, 90% { opacity: 1; transform: scale(1); }
        98%, 100% { opacity: 0; transform: scale(0.2); }
      }
      @media (prefers-reduced-motion: reduce) {
        .mat-stroke-3 { animation: none; stroke-dashoffset: 0; }
        .mat-accent-3 { animation: none; opacity: 1; transform: none; }
      }
    </style>
  </defs>

  <!-- Card Branco Oficial -->
  <rect x="6" y="6" width="208" height="248" rx="18" fill="#FFFFFF" stroke="#DCE8DE" stroke-width="1.5" />

  <!-- Plano Editorial Névoa #DCE8DE (Pág. 14) -->
  <rect x="20" y="20" width="180" height="108" rx="12" fill="#DCE8DE" />
  <circle class="mat-accent-3" cx="182" cy="34" r="6" />

  <!-- Ícone Oficial de Lâmpadas (Coordenadas Exatas da Pág. 14) -->
  <g transform="translate(74, 38) scale(1.5)">
    <path class="mat-stroke-3" d="M 16 31 C 15 24 10 24 10 17 C 10 0 38 0 38 17 C 38 24 33 25 32 31" />
    <path class="mat-stroke-3" d="M 17 33 L 31 33 M 18 39 L 30 39 M 21 44 L 27 44" />
  </g>

  <!-- Rótulo Explícito e Orientação -->
  <text x="22" y="162" font-family="'Manrope', sans-serif" font-size="17" font-weight="700" fill="#153F35">Lâmpadas</text>
  <text x="22" y="192" font-family="'DM Sans', sans-serif" font-size="13" fill="#23352D">Distinguir os tipos na futura</text>
  <text x="22" y="210" font-family="'DM Sans', sans-serif" font-size="13" fill="#23352D">orientação.</text>
</svg>
