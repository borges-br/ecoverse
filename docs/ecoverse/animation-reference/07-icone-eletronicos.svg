<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&amp;family=Manrope:wght@700&amp;display=swap');
      .mat-stroke-2 {
        stroke: #153F35;
        stroke-width: 2.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 170;
        stroke-dashoffset: 170;
        animation: matDraw2 4.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .mat-accent-2 {
        fill: #28735A;
        transform-origin: 182px 34px;
        opacity: 0;
        animation: matDot2 4.6s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }
      @keyframes matDraw2 {
        0% { stroke-dashoffset: 170; }
        17.4%, 90% { stroke-dashoffset: 0; }
        98%, 100% { stroke-dashoffset: 170; }
      }
      @keyframes matDot2 {
        0%, 16.5% { opacity: 0; transform: scale(0.2); }
        22.8%, 90% { opacity: 1; transform: scale(1); }
        98%, 100% { opacity: 0; transform: scale(0.2); }
      }
      @media (prefers-reduced-motion: reduce) {
        .mat-stroke-2 { animation: none; stroke-dashoffset: 0; }
        .mat-accent-2 { animation: none; opacity: 1; transform: none; }
      }
    </style>
  </defs>

  <!-- Card Branco Oficial -->
  <rect x="6" y="6" width="208" height="248" rx="18" fill="#FFFFFF" stroke="#DCE8DE" stroke-width="1.5" />

  <!-- Plano Editorial Azul Suave #DDEAF5 (Pág. 14) -->
  <rect x="20" y="20" width="180" height="108" rx="12" fill="#DDEAF5" />
  <circle class="mat-accent-2" cx="182" cy="34" r="6" />

  <!-- Ícone Oficial de Eletrônicos (Coordenadas Exatas da Pág. 14) -->
  <g transform="translate(74, 38) scale(1.5)">
    <rect class="mat-stroke-2" x="5" y="7" width="38" height="27" rx="4" />
    <path class="mat-stroke-2" d="M 12 27 L 36 27" />
    <path class="mat-stroke-2" d="M 24 34 L 24 41" />
    <path class="mat-stroke-2" d="M 15 42 L 33 42" />
  </g>

  <!-- Rótulo Explícito e Orientação -->
  <text x="22" y="162" font-family="'Manrope', sans-serif" font-size="17" font-weight="700" fill="#153F35">Eletrônicos</text>
  <text x="22" y="192" font-family="'DM Sans', sans-serif" font-size="13" fill="#23352D">Subtipos devem estar</text>
  <text x="22" y="210" font-family="'DM Sans', sans-serif" font-size="13" fill="#23352D">visíveis no aceite.</text>
</svg>
